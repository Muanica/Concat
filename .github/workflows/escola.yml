# Pacote para a escola.
#
# Monta, a partir de uma execução do "Build app", uma pasta que corre num
# computador da escola sem instalação e sem internet: o programa, as suas
# definições já escolhidas e os modelos das legendas automáticas já lá
# dentro.
#
# Uma pasta e não um instalador: instalar pede permissões de
# administrador que as crianças não têm, e uma pasta copia-se de máquina
# para máquina com uma pen.
#
# Sai como um só .exe, publicado como release do fork: um artefacto do
# GitHub vem sempre dentro de um ZIP e só se descarrega com sessão
# iniciada, e um release descarrega-se sem sessão, com barra de progresso.
# O .exe instala a pasta sem pedir administrador.
#
# O que a faz funcionar sem internet são duas coisas. A pasta `portable`
# ao lado do executável, que o Concat usa em vez de %APPDATA%
# (concat-host/src/dirs.rs), leva as definições e os modelos com ela. E
# `updateChecks: false` nas definições deixa a página Versão à espera do
# botão em vez de gastar um minuto num pedido que não pode chegar.
#
# Não compila nada: pega nos binários que o "Build app" já fez, junta-lhes
# o resto e publica tudo como um artefacto. Corre em minutos.
name: Pacote para a escola

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "O número da execução do Build app de onde vêm os binários"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  pacote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buscar os binários
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name Concat-windows-x86_64 \
            --dir binarios
          ls -l binarios

      # A pasta que o "Build app" preparou, que ele publica zipada ao lado
      # dos instaladores. Os instaladores ficam de fora do pacote.
      - name: Abrir a pasta do programa
        id: app
        run: |
          set -euo pipefail
          zip=$(find binarios -maxdepth 1 -type f -name 'Concat-*-windows-*-portable.zip' | head -1)
          if [ -z "$zip" ]; then
            echo "A execução ${{ inputs.run_id }} não traz a pasta do programa."
            echo "Só as execuções do Build app feitas depois de 26/11/2026 a publicam;"
            echo "lance o Build app outra vez e use o número dessa."
            ls -l binarios
            exit 1
          fi
          mkdir -p pacote
          unzip -q "$zip" -d pacote
          if [ ! -f pacote/concat.exe ]; then
            echo "$zip não tem concat.exe dentro:"
            find pacote -maxdepth 1 | head -20
            exit 1
          fi
          echo "A pasta veio de $zip"

      # Os modelos das legendas, da release onde o Concat os espelha
      # (concat-host/src/models.rs). Conferidos contra o SHA-256 que
      # models/manifest.toml guarda, que é o mesmo que o programa confere
      # quando os descarrega ele próprio: um modelo truncado pela rede
      # falha aqui, e não na aula, onde não há como voltar a buscá-lo.
      #
      # Base Multilingue é o que fica escolhido; Tiny Multilingue vai
      # junto para os computadores onde o Base for lento de mais. O modelo
      # da detecção de voz não é preciso aqui: vai dentro do executável.
      - name: Buscar os modelos das legendas
        run: |
          set -euo pipefail
          destino=pacote/portable/whisper-models
          mkdir -p "$destino"
          for modelo in ggml-base.bin ggml-tiny.bin; do
            esperado=$(sed -n "/^file = \"$modelo\"/,/^sha256/p" models/manifest.toml |
              sed -n 's/^sha256 = "\(.*\)"/\1/p' | head -1)
            if [ -z "$esperado" ]; then
              echo "models/manifest.toml não diz o SHA-256 de $modelo"
              exit 1
            fi
            echo "A buscar $modelo"
            curl -fsSL --retry 3 -o "$destino/$modelo" \
              "https://github.com/jub0t/Concat/releases/download/models-v1/$modelo"
            obtido=$(sha256sum "$destino/$modelo" | cut -d' ' -f1)
            if [ "$obtido" != "$esperado" ]; then
              echo "$modelo chegou errado: $obtido, esperava $esperado"
              exit 1
            fi
            echo "$modelo está bom"
          done
          ls -l "$destino"

      # As definições com que o programa abre na escola, na pasta
      # `portable`, que é onde o Concat as procura quando ela existe.
      #
      # pt-BR é o português que o Concat traz; não há pt-PT nos ficheiros
      # de idioma. scrubCopies faz a cópia pequena de cada vídeo, sem a
      # qual a pré-visualização trava nestas máquinas. A linha do tempo
      # magnética fecha o buraco quando se apaga um clipe, como no CapCut
      # de onde as crianças vêm: sem ela ficam espaços pretos no meio do
      # vídeo, que é o engano mais comum de quem começa.
      - name: Escrever as definições
        run: |
          set -euo pipefail
          cat > pacote/portable/settings.json <<'JSON'
          {
            "locale": "pt-BR",
            "scrubCopies": true,
            "updateChecks": false,
            "transcriberModel": "base",
            "captionLanguage": "pt",
            "magnetic": true,
            "magneticChosen": true
          }
          JSON
          python3 -c "import json;json.load(open('pacote/portable/settings.json'))"
          cat pacote/portable/settings.json

      - name: Escrever o LEIA-ME
        run: cp assets/escola/LEIA-ME.txt pacote/LEIA-ME.txt

      - name: O pacote, como fica
        run: |
          set -euo pipefail
          du -sh pacote
          find pacote -maxdepth 2 | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Concat-Escola-windows-x86_64
          path: pacote
          if-no-files-found: error

  # O instalador, compilado e testado num Windows, e publicado.
  instalador:
    needs: pacote
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buscar a pasta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" `
            --name Concat-Escola-windows-x86_64 --dir pacote
          if ($LASTEXITCODE -ne 0) { throw "não consegui buscar a pasta" }
          if (-not (Test-Path pacote\concat.exe)) { throw "pacote\concat.exe não está lá" }

      - name: Compilar o instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "O Inno Setup não está em $iscc" }
          & $iscc "/DVersion=${{ github.run_number }}" "/DStage=$PWD\pacote" `
            "/DOut=$PWD\saida" assets\windows\escola.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou: $LASTEXITCODE" }
          Get-Item saida\Concat-Escola-Setup.exe | Format-List Name, Length

      # Instala de verdade, em silêncio, numa pasta de teste, e vê o que
      # ficou: um instalador que compila mas deixa a pasta incompleta só se
      # descobriria na escola, onde não há internet para o voltar a buscar.
      - name: Testar a instalação
        run: |
          $destino = "$PWD\teste"
          $p = Start-Process -FilePath saida\Concat-Escola-Setup.exe -Wait -PassThru `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$destino`"","/TASKS=`"desktopicon`""
          if ($p.ExitCode -ne 0) { throw "A instalação saiu com $($p.ExitCode)" }
          foreach ($f in @("concat.exe","avcodec-62.dll","whisper.dll","LEIA-ME.txt",
                           "portable\settings.json",
                           "portable\whisper-models\ggml-base.bin",
                           "portable\whisper-models\ggml-tiny.bin")) {
            if (-not (Test-Path "$destino\$f")) { throw "Faltou $f na instalação" }
            Write-Host "ok  $f"
          }
          $base = (Get-Item "$destino\portable\whisper-models\ggml-base.bin").Length
          if ($base -ne 147951465) { throw "ggml-base.bin tem $base bytes" }
          Get-Content "$destino\portable\settings.json"

      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash saida\Concat-Escola-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Concat-Escola-Setup.exe" | Out-File -Encoding ascii saida\Concat-Escola-Setup.exe.sha256
          # Um release só, com um endereço que não muda: o que houver é
          # substituído. O primeiro, de um ZIP, também sai.
          foreach ($tag in @("escola", "escola-45732181726")) {
            try { gh release delete $tag --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null } catch {}
          }
          $global:LASTEXITCODE = 0
          $notas = "Instalador para a escola: um só ficheiro, sem internet e sem administrador. " +
            "Faça duplo clique; na primeira vez o Windows mostra um aviso azul: " +
            "clique em Mais informações e depois em Executar mesmo assim. " +
            "O programa instala-se na conta de quem o executa, com as legendas automáticas já dentro. " +
            "Software livre AGPL-3.0-or-later; o código está neste repositório. SHA-256: $hash"
          gh release create escola saida\Concat-Escola-Setup.exe saida\Concat-Escola-Setup.exe.sha256 `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Concat Escola (compilação ${{ github.run_number }})" --notes $notas
          if ($LASTEXITCODE -ne 0) { throw "não consegui publicar o release" }
